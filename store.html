<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mağaza — GameStore</title>
  <link rel="stylesheet" href="css/style.css?v=3" />
  <script>if((performance.getEntriesByType('navigation')[0]||{}).type==='reload'||performance.navigation&&performance.navigation.type===1){window.location.replace('index.html');}</script>
</head>
<body>

<nav class="navbar" id="navbar"></nav>

<div class="container">
  <div class="breadcrumb">
    <a href="index.html">Ana Sayfa</a> › <span>Mağaza</span>
  </div>

  <h1 class="section-title">🛒 Oyun Mağazası</h1>

  <!-- FILTER BAR -->
  <div class="filter-bar">
    <label>Kategori:</label>
    <select id="filter-cat">
      <option value="">Tümü</option>
    </select>

    <label>Stok:</label>
    <select id="filter-stock">
      <option value="">Tümü</option>
      <option value="instock">Stokta Var</option>
      <option value="low">Az Kaldı (≤5)</option>
      <option value="out">Tükendi</option>
      <option value="free">Ücretsiz</option>
    </select>

    <label>Sırala:</label>
    <select id="filter-sort">
      <option value="default">Varsayılan</option>
      <option value="price-asc">Fiyat: Düşük→Yüksek</option>
      <option value="price-desc">Fiyat: Yüksek→Düşük</option>
      <option value="stock-desc">Stok: Çok→Az</option>
      <option value="name-asc">İsim: A→Z</option>
    </select>

    <input type="text" id="filter-search" placeholder="🔍 Oyun adı ara..." style="min-width:180px;" />

    <button class="btn btn-sm btn-secondary" onclick="resetFilters()">Sıfırla</button>
  </div>

  <!-- RESULTS INFO -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">
    <span id="result-count" style="color:var(--text-muted);font-size:0.88rem;"></span>
  </div>

  <!-- GAMES GRID -->
  <div class="games-grid" id="games-grid"></div>
</div>

<footer>
  <p>© 2026 GameStore — Tüm hakları saklıdır. &nbsp;|&nbsp; <a href="store.html">Mağaza</a> &nbsp;|&nbsp; <a href="cart.html">Sepet</a></p>
  <span class="dev-credit">Developed by Kerim Avcı</span>
</footer>

<script src="js/data.js?v=3"></script>
<script src="js/api.js?v=3"></script>
<script src="js/utils.js?v=3"></script>
<script>
  let products = [];
  let _storeUser = null;
  let _storeWishlist = [];

  function getFiltered() {
    const cat = document.getElementById('filter-cat').value;
    const stock = document.getElementById('filter-stock').value;
    const sort = document.getElementById('filter-sort').value;
    const search = document.getElementById('filter-search').value.trim().toLowerCase();

    let list = [...products];

    if (cat) list = list.filter(p => p.category === cat);
    if (stock === 'instock') list = list.filter(p => p.stock > 5);
    else if (stock === 'low') list = list.filter(p => p.stock > 0 && p.stock <= 5);
    else if (stock === 'out') list = list.filter(p => p.stock === 0);
    else if (stock === 'free') list = list.filter(p => p.price === 0);
    if (search) list = list.filter(p =>
      p.title.toLowerCase().includes(search) ||
      (p.tags || []).some(t => t.toLowerCase().includes(search)) ||
      p.category.toLowerCase().includes(search)
    );

    if (sort === 'price-asc') list.sort((a, b) => a.price - b.price);
    else if (sort === 'price-desc') list.sort((a, b) => b.price - a.price);
    else if (sort === 'stock-desc') list.sort((a, b) => b.stock - a.stock);
    else if (sort === 'name-asc') list.sort((a, b) => a.title.localeCompare(b.title, 'tr'));

    return list;
  }

  function render() {
    const list = getFiltered();
    const grid = document.getElementById('games-grid');
    document.getElementById('result-count').textContent = `${list.length} oyun bulundu`;

    if (list.length === 0) {
      grid.innerHTML = '<p class="no-results">Arama kriterlerinize uygun oyun bulunamadı.</p>';
      return;
    }
    grid.innerHTML = list.map(p => gameCardHTML(p, _storeUser, _storeWishlist)).join('');
  }

  function resetFilters() {
    document.getElementById('filter-cat').value = '';
    document.getElementById('filter-stock').value = '';
    document.getElementById('filter-sort').value = 'default';
    document.getElementById('filter-search').value = '';
    render();
  }

  ['filter-cat', 'filter-stock', 'filter-sort'].forEach(id => {
    document.getElementById(id).addEventListener('change', render);
  });
  document.getElementById('filter-search').addEventListener('input', render);

  (async () => {
    await renderNavbar('store');

    [_storeUser, products, _storeWishlist] = await Promise.all([
      DB.getCurrentUser().catch(() => null),
      DB.getProducts().catch(() => []),
      DB.getWishlist().catch(() => [])
    ]);

    const cats = [...new Set(products.map(p => p.category))];
    const catSel = document.getElementById('filter-cat');
    cats.forEach(c => {
      const o = document.createElement('option');
      o.value = c; o.textContent = c;
      catSel.appendChild(o);
    });

    const params = new URLSearchParams(window.location.search);
    if (params.get('q')) document.getElementById('filter-search').value = params.get('q');
    if (params.get('cat')) document.getElementById('filter-cat').value = params.get('cat');
    if (params.get('filter') === 'free') document.getElementById('filter-stock').value = 'free';

    render();
  })();
</script>
</body>
</html>
