<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sepetim — GameStore</title>
  <link rel="stylesheet" href="css/style.css?v=3" />
  <script>if((performance.getEntriesByType('navigation')[0]||{}).type==='reload'||performance.navigation&&performance.navigation.type===1){window.location.replace('index.html');}</script>
</head>
<body>

<nav class="navbar" id="navbar"></nav>

<div class="container">
  <div class="breadcrumb">
    <a href="index.html">Ana Sayfa</a> › <span>Sepetim</span>
  </div>
  <h1 class="section-title">🛒 Sepetim</h1>

  <div id="cart-content"></div>
</div>

<footer>
  <p>© 2026 GameStore — Tüm hakları saklıdır. &nbsp;|&nbsp; <a href="store.html">Mağaza</a> &nbsp;|&nbsp; <a href="cart.html">Sepet</a></p>
  <span class="dev-credit">Developed by Kerim Avcı</span>
</footer>

<!-- Satın Alma Onay Modalı -->
<div class="modal-overlay" id="checkout-modal">
  <div class="modal">
    <div class="modal-header">
      <h3>✅ Siparişi Onayla</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div id="modal-body"></div>
    <div style="display:flex;gap:0.8rem;margin-top:1.5rem;">
      <button class="btn btn-success" style="flex:1;" onclick="confirmPurchase()">Satın Al</button>
      <button class="btn btn-secondary" style="flex:1;" onclick="closeModal()">İptal</button>
    </div>
  </div>
</div>

<script src="js/data.js?v=3"></script>
<script src="js/api.js?v=3"></script>
<script src="js/utils.js?v=3"></script>
<script>
  async function render() {
    const user = await DB.getCurrentUser();
    const cartItems = await DB.getCartProducts();
    const content = document.getElementById('cart-content');

    if (cartItems.length === 0) {
      content.innerHTML = `
        <div class="empty-cart">
          <div class="empty-icon">🛒</div>
          <h3>Sepetiniz Boş</h3>
          <p>Henüz sepetinize oyun eklemediniz.</p>
          <a href="store.html" class="btn btn-primary" style="margin-top:1.5rem;display:inline-block;">Mağazaya Git</a>
        </div>`;
      return;
    }

    const stockWarnings = cartItems.filter(c => c.product.stock <= 0);

    const total = cartItems.reduce((s, c) => s + parseFloat(c.product.price||0), 0);
    const itemsHTML = cartItems.map(c => {
      const p = c.product;
      const daysLeft = p.days_left !== undefined ? p.days_left : 14;
      const stockWarn = p.stock <= 0
        ? '<div class="cart-item-stock-warn">⚠️ Bu ürün tükendi! Satın alamazsınız.</div>'
        : p.stock <= 5
          ? `<div style="color:var(--accent-orange);font-size:0.8rem;margin-top:0.2rem;">⚠️ Son ${p.stock} adet kaldı!</div>`
          : '';
      const expColor = daysLeft <= 3 ? 'var(--accent-red)' : daysLeft <= 7 ? 'var(--accent-orange)' : 'var(--text-muted)';
      const expiryBadge = `<div style="font-size:0.75rem;color:${expColor};margin-top:0.3rem;">⏳ Sepetten düşme: <strong>${daysLeft}</strong> gün kaldı</div>`;
      const imgHTML = p.image
        ? `<img src="${p.image}" alt="${p.title}" style="width:100%;height:100%;object-fit:cover;border-radius:6px;" onerror="this.style.display='none'" />`
        : `<span style="font-size:1.8rem;line-height:1;">${p.emoji || '🎮'}</span>`;
      return `
        <div class="cart-item">
          <div class="cart-item-icon" style="overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--bg-secondary);border-radius:6px;">
            ${imgHTML}
          </div>
          <div class="cart-item-info">
            <div class="cart-item-title">
              <a href="game.html?id=${p.id}" style="color:var(--text-bright);">${p.title}</a>
            </div>
            <div class="cart-item-price">${formatPrice(p.price)}</div>
            ${stockWarn}
            ${expiryBadge}
          </div>
          <div class="cart-item-actions">
            ${stockBadgeHTML(p.stock)}
            <button class="btn btn-sm btn-danger" onclick="removeItem('${p.id}')">Kaldır</button>
          </div>
        </div>`;
    }).join('');

    const summaryHTML = `
      <div class="cart-summary">
        <h3>Sipariş Özeti</h3>
        <div class="summary-row"><span>${cartItems.length} oyun</span><span>${formatPrice(total)}</span></div>
        <div class="summary-row"><span>İndirim</span><span>₺0</span></div>
        <div class="summary-row total"><span>Toplam</span><span>${formatPrice(total)}</span></div>
        ${stockWarnings.length > 0
          ? `<div class="alert alert-error" style="margin-top:1rem;font-size:0.82rem;">⚠️ Sepetinizde tükenmiş ürünler var. Lütfen kaldırın.</div>`
          : `<button class="btn btn-success" style="width:100%;margin-top:1rem;padding:0.9rem;" onclick="openCheckout()">✅ Satın Al</button>`
        }
        <button class="btn btn-secondary btn-sm" style="width:100%;margin-top:0.6rem;" onclick="clearCartConfirm()">Sepeti Temizle</button>
      </div>`;

    content.innerHTML = `
      <div class="cart-layout">
        <div class="cart-items">${itemsHTML}</div>
        ${summaryHTML}
      </div>`;
  }

  async function removeItem(id) {
    await DB.removeFromCart(id);
    showToast('Ürün sepetten kaldırıldı.', 'info');
    render();
  }

  async function clearCartConfirm() {
    if (confirm('Sepeti tamamen temizlemek istiyor musunuz?')) {
      await DB.clearCart();
      showToast('Sepet temizlendi.', 'info');
      render();
    }
  }

  async function openCheckout() {
    const user = await DB.getCurrentUser();
    if (!user) {
      showToast('Satın almak için giriş yapmalısınız.', 'warning');
      setTimeout(() => { window.location.href = 'login.html'; }, 800);
      return;
    }
    const cartItems = await DB.getCartProducts();
    const total = cartItems.reduce((s, c) => s + parseFloat(c.product.price||0), 0);
    const itemsListHTML = cartItems.map(c =>
      `<div style="display:flex;justify-content:space-between;padding:0.4rem 0;border-bottom:1px solid var(--border);font-size:0.9rem;">
        <span>${c.product.emoji} ${c.product.title}</span>
        <span style="color:var(--accent-hover)">${formatPrice(c.product.price)}</span>
      </div>`
    ).join('');

    document.getElementById('modal-body').innerHTML = `
      ${itemsListHTML}
      <div style="display:flex;justify-content:space-between;padding:0.8rem 0 0;font-weight:700;font-size:1.05rem;color:var(--text-bright);">
        <span>Toplam</span><span>${formatPrice(total)}</span>
      </div>
      <div style="margin-top:0.8rem;padding:0.7rem;background:rgba(26,159,255,0.1);border-radius:6px;font-size:0.82rem;color:var(--text-muted);">
        ℹ️ Satın alındıktan sonra oyunlar kütüphanenize eklenir ve stoklar güncellenir.
      </div>`;

    document.getElementById('checkout-modal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('checkout-modal').classList.remove('open');
  }

  async function confirmPurchase() {
    const user = await DB.getCurrentUser();
    if (!user) return;

    const result = await DB.createOrder();
    closeModal();

    if (result.ok) {
      showToast('🎉 Satın alma başarılı! Oyunlar kütüphanenize eklendi.', 'success');
      setTimeout(() => { window.location.href = 'profile.html'; }, 1500);
    } else {
      showToast(result.msg, 'error');
      render();
    }
  }

  document.getElementById('checkout-modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  (async () => {
    await renderNavbar('');
    await render();
  })();
</script>
</body>
</html>
